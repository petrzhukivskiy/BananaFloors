# Banana Floors: full nginx site config (proposed, r31)
# Install as /etc/nginx/sites-available/bananafloors and symlink into sites-enabled.
# BEFORE enabling: compare with the current live file (sudo nginx -T) and confirm
# the certificate paths below match what certbot created on this droplet.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# What this adds: HTTP->HTTPS and www->non-www 301s, HTTP/2, utf-8 charset,
# gzip for CSS/JS/SVG/JSON, long caching for versioned assets, HSTS and basic
# security headers, a branded 404, redirects for the retired root-level page
# copies, and it blocks repo internals (.git, server/, deploy/, tools/, source
# image masters, env/config files) that are currently publicly downloadable.

# --- Port 80: everything -> https://bananafloors.com ------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bananafloors.com www.bananafloors.com;

    # Let certbot renewals keep working (webroot or nginx plugin).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        return 301 https://bananafloors.com$request_uri;
    }
}

# --- 443 www -> non-www -----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bananafloors.com;

    ssl_certificate     /etc/letsencrypt/live/bananafloors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bananafloors.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bananafloors.com$request_uri;
}

# --- Main site ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bananafloors.com;

    root /var/www/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    ssl_certificate     /etc/letsencrypt/live/bananafloors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bananafloors.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers. HSTS starts at 1 year without preload; add "; preload"
    # only after confirming every subdomain (incl. M365 records) serves HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/xml application/xml application/ld+json image/x-icon;

    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }

    # ---- Block repo internals / non-public files (return 404, not 403) ----
    location ^~ /.well-known/acme-challenge/ { default_type text/plain; try_files $uri =404; }
    location ~ /\.  { return 404; }                     # .git, .env, .gitignore ...
    location ~ ^/(server|deploy|tools|_image-originals|_design-reference|node_modules)(/|$) { return 404; }
    location ~* \.(py|pyc|sh|conf|service|env|example|md|lock|log|bak|orig|zip)$ { return 404; }
    location ~* ^/(README\.txt|package(-lock)?\.json|site-knowledge\.json|server\.js)$ { return 404; }

    # ---- Duplicate URL clean-up ----
    # Only redirect when the visitor actually typed /index.html (the index
    # directive also maps "/" to /index.html internally, so check $request_uri).
    location = /index.html {
        if ($request_uri ~* "^/index\.html") { return 301 /$is_args$args; }
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Retired root-level copies of service/location pages -> canonical URLs
    location ~ ^/(lvp-flooring-portland|hardwood-flooring-portland|engineered-wood-flooring-portland|laminate-flooring-portland|tile-flooring-portland|carpet-installation-portland)\.html$ {
        return 301 /flooring/$1.html;
    }
    location ~ ^/(flooring-installation-(?:beaverton-or|clackamas-or|gresham-or|happy-valley-or|lake-oswego-or|oregon-city-or|tigard-or))\.html$ {
        return 301 /locations/$1.html;
    }

    # ---- AI assistant API (same as deploy/nginx-ai-location.conf) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Caching ----
    # Versioned assets (-r19, -r31 ... in the filename) never change: cache 1 year.
    location ~* -r\d+[^/]*\.(css|js|webp|png|jpg|jpeg|ico|svg|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* \.(webp|png|jpg|jpeg|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }

    # HTML: always revalidate so updates show immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ =404;
    }
}
